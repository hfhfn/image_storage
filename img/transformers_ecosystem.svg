<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="680" height="500" fill="#ffffff"/>

  <!-- ══ 层一：HF Hub ══ -->
  <rect x="220" y="20" width="240" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="39" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">HuggingFace Hub</text>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">云端模型仓库 · 托管权重与配置</text>

  <!-- Hub → Transformers -->
  <line x1="340" y1="66" x2="340" y2="102" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ══ 层二：Transformers ══ -->
  <rect x="120" y="102" width="440" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="121" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">🤗 Transformers（接口中枢）</text>
  <text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">统一 API · from_pretrained · 分词器 · 生成逻辑</text>

  <!-- Transformers 分三条线 -->
  <path d="M 228 148 L 228 168 L 105 168 L 105 192" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="148" x2="340" y2="192" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 452 148 L 452 168 L 575 168 L 575 192" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 列标题 -->
  <text x="105" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#712B13">微调层（可选）</text>
  <text x="340" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">训练加速层（可选）</text>
  <text x="575" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">推理服务层（可选）</text>

  <!-- 虚线并列框 -->
  <rect x="32"  y="196" width="146" height="156" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 3"/>
  <rect x="267" y="196" width="146" height="156" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 3"/>
  <rect x="502" y="196" width="146" height="156" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 3"/>

  <!-- ── 微调列 ── -->
  <rect x="42"  y="204" width="126" height="38" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="105" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">LoRA / QLoRA</text>
  <text x="105" y="233" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">参数高效微调</text>

  <rect x="42"  y="252" width="126" height="38" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="105" y="267" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">TRL / PEFT 库</text>
  <text x="105" y="281" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">SFT · DPO · GRPO</text>

  <rect x="42"  y="300" width="126" height="38" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="105" y="315" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">LLaMA-Factory</text>
  <text x="105" y="329" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">一站式 Web UI</text>

  <!-- ── 训练列 ── -->
  <rect x="277" y="204" width="126" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">DeepSpeed</text>
  <text x="340" y="233" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#185FA5">ZeRO 多机分布式</text>

  <rect x="277" y="252" width="126" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="267" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">FSDP</text>
  <text x="340" y="281" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#185FA5">PyTorch 原生分片</text>

  <rect x="277" y="300" width="126" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="315" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">Unsloth</text>
  <text x="340" y="329" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#185FA5">单卡 Triton 加速</text>

  <!-- ── 推理列 ── -->
  <rect x="512" y="204" width="126" height="38" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="575" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">vLLM</text>
  <text x="575" y="233" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#854F0B">PagedAttention</text>

  <rect x="512" y="252" width="126" height="38" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="575" y="267" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">SGLang</text>
  <text x="575" y="281" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#854F0B">RadixAttention</text>

  <rect x="512" y="300" width="126" height="38" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="575" y="315" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">TensorRT-LLM</text>
  <text x="575" y="329" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#854F0B">NVIDIA 极致性能</text>

  <!-- 三列汇聚 → PyTorch -->
  <path d="M 105 354 L 105 390 L 277 390" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="354" x2="340" y2="402" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 575 354 L 575 390 L 403 390" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ══ 层四：PyTorch ══ -->
  <rect x="185" y="402" width="310" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="340" y="421" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">PyTorch</text>
  <text x="340" y="437" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">张量计算 · 自动微分 · 基础运行时</text>

  <!-- 并列说明 -->
  <text x="105" y="466" text-anchor="middle" font-size="10" fill="#888780">三选一 / 可组合</text>
  <text x="340" y="466" text-anchor="middle" font-size="10" fill="#888780">三选一</text>
  <text x="575" y="466" text-anchor="middle" font-size="10" fill="#888780">三选一</text>
</svg>
